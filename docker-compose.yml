services:
  api:
    build: .
    command: ["/bin/api"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - SUPABASE_JWKS_URL=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: ["/bin/worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"